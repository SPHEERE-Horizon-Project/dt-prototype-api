                - {
                    building_id: B1,
                    zone_id: Z1,
                    zone_name: Main zone,
                    end_use: office,
                    n_floors: 1,
                    net_floor_area_m2: 100,
                    volume_m3: 300,
                  }
              surfaces:
                - {
                    building_id: B1,
                    zone_id: Z1,
                    surface_index: 1,
                    surface_type: ExtWall,
                    area_m2: 120,
                    azimuth_deg: 180,
                    tilt_deg: 90,
                  }
                - {
                    building_id: B1,
                    zone_id: Z1,
                    surface_index: 2,
                    surface_type: Roof,
                    area_m2: 100,
                    azimuth_deg: 0,
                    tilt_deg: 0,
