      summary: Single-building variable-base degree-day calculation
      value:
        project:
          schema_version: "1.0"
          inputs: *sample_inputs
          operating: *sample_operating
          run_id: example_vbdd
        weather_epw: example-city.epw
    EnergyRequest:
      summary: Monthly energy consumption and PV balance
      description:
        Uses the illustrative factors and prices in EnergyConfigExample. Upload an EPW file in
        place of the filename.
      value:
        project:
          schema_version: "1.0"
          inputs: *sample_inputs
          operating: *sample_operating
          run_id: example_energy
        weather_epw: example-city.epw
        energy: *sample_energy
    ValidateEnergyRequest:
      summary: Check an incomplete energy configuration
      description: |
        Returns HTTP `200` with a failed report because the energy configuration is empty.
      value:
        kind: energy
        energy: {}
    InverseFitRequest:
      summary: Fit a model to synthetic CSV observations
      description:
        |
          Upload `prototype/data/examples/inverse/synthetic_billing.csv` as
          `observations` and `synthetic_weather.csv` from the same folder as `weather`.
          These simulated readings are for testing and cannot pass measured-data acceptance.
      value:
        run_id: example_inverse
        config:
          schema_version: "1.0"
          operation: fit
          clock:
            convention: standard
            timezone: Etc/GMT-1
          source:
            type: csv
            series:
              synthetic-building/import:
                source_type: simulated
                source_id: SYNTHETIC_testing_only
                building_id: synthetic-building
                scenario_id: baseline
                carrier: electricity
                meter_boundary_id: electricity_grid_import
                weather_id: default
                description: Synthetic hourly load/PV-shaped import; not measured data
          worker_timeout_s: 1800
          models:
            - 5p_monthly
        observations: synthetic_billing.csv
        weather: synthetic_weather.csv
    PipelineForwardRequest:
      summary: Run monthly thermal and energy calculations
      value:
        run_id: example_pipeline_forward
        pipeline:
          schema_version: "1.0"
          energy: { engine: Monthly_SS, mode: run }
        project:
          schema_version: "1.0"
          inputs: *sample_inputs
          operating: *sample_operating
        weather_epw: example-city.epw
        energy: *sample_energy
    PipelineReuseRequest:
