        project:
          run_id: example_dynamic
          schema_version: "1.0"
          inputs: &sample_inputs
            geometry:
              format: tabular
              buildings:
                - {
                    building_id: B1,
                    building_name: Example building,
                    envelope: standard,
                    heating_system: IdealLoad,
                    cooling_system: IdealLoad,
                    solar_technologies: "",
                    n_floors: 1,
                    height_m: 3,
                    footprint_area_m2: 100,
