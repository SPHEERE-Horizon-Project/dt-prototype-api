                - {
                    building_id: B1,
                    zone_id: Z1,
                    surface_index: 3,
                    surface_type: GroundFloor,
                    area_m2: 100,
                    azimuth_deg: 0,
                    tilt_deg: 180,
                  }
            envelopes:
              envelopes:
                standard:
                  ext_wall: { u_value: 0.4, mass_class: Medium }
                  roof: { u_value: 0.3, mass_class: Medium }
                  ground_floor: { u_value: 0.5, mass_class: Heavy }
