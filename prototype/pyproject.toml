[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dt-prototype"
version = "0.4.0"
description = "Independent dynamic, monthly and simplified building-energy tools with shared inputs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "matplotlib"]
license = {text = "See LICENSE and THIRD_PARTY_NOTICES.md"}

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
dt-prototype = "dt_prototype.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dt_prototype.integration.model3" = [
  "*.md",
  "example_data/*.csv",
  "reference_outputs/*.csv",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "--import-mode=importlib"
