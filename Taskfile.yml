version: "3"

env:
  UV_CACHE_DIR: .cache/uv

tasks:
  setup:
    desc: Install the API, copied prototype, and development tools
    cmds:
      - uv sync --python 3.12 --extra dev

  version:
    desc: Print the API package version
    silent: true
    cmds:
      - uv version --short

  release:patch:
    desc: Prepare a patch release locally
    cmds:
      - task: release:prepare
        vars: { BUMP: patch }

  release:minor:
    desc: Prepare a minor release locally
    cmds:
      - task: release:prepare
        vars: { BUMP: minor }

  release:major:
    desc: Prepare a major release locally
    cmds:
      - task: release:prepare
        vars: { BUMP: major }

  release:prepare:
    internal: true
    cmds:
      - uv run --no-project --python 3.12 python scripts/release.py prepare {{.BUMP}}

  release:push:
    desc: Push the prepared release commit and tag to origin
    cmds:
      - uv run --no-project --python 3.12 python scripts/release.py push

  serve:
    desc: Serve the local API at http://127.0.0.1:8000
    cmds:
      - uv run --extra dev uvicorn spheere_dt_api.app:app --host 127.0.0.1 --port 8000

  test:
    desc: Run API and copied prototype tests
    cmds:
      - uv run --extra dev pytest -q tests
      # OpenDSM tests need the separate worker environment (see setup:opendsm).
      - >-
        uv run --extra dev pytest -q -p no:cacheprovider -c prototype/pyproject.toml
        prototype/tests prototype/to_be_integrated/lcc/tests prototype/to_be_integrated/lca/tests
        prototype/to_be_integrated/circularity/tests
        {{if not .DT_OPENDSM_PYTHON}}-m "not opendsm"{{end}}

  lint:
    desc: Lint the API, helper scripts, and API tests
    cmds:
      - uv run --extra dev ruff check src/spheere_dt_api scripts tests

  format:
    desc: Format the API, helper scripts, and API tests
    cmds:
      - uv run --extra dev ruff check --select I --fix src/spheere_dt_api scripts tests
      - uv run --extra dev ruff format src/spheere_dt_api scripts tests

  format:check:
    desc: Check API formatting without changing files
    cmds:
      - uv run --extra dev ruff format --check src/spheere_dt_api scripts tests

  openapi:validate:
    desc: Validate the OpenAPI document
    cmds:
      - uv run --extra dev openapi-spec-validator DT-PROTOTYPE-OPENAPI.yaml

  example:dynamic:
    desc: Run the one-zone dynamic example against the local server
    silent: true
    cmds:
      - uv run --extra dev python scripts/example_call.py dynamic

  example:monthly:
    desc: Run the one-zone monthly example against the local server
    silent: true
    cmds:
      - uv run --extra dev python scripts/example_call.py monthly

  example:simplified:
    desc: Run the one-zone simplified example against the local server
    silent: true
    cmds:
      - uv run --extra dev python scripts/example_call.py simplified

  example:vbdd:
    desc: Run the one-zone degree-day example against the local server
    silent: true
    cmds:
      - uv run --extra dev python scripts/example_call.py vbdd

  example:energy:
    desc: Run the one-zone energy example (monthly method) against the local server
    silent: true
    cmds:
      - uv run --extra dev python scripts/example_call.py monthly --energy

  setup:opendsm:
    desc: Create the separate OpenDSM environment in .venv-opendsm for inverse-model tests
    cmds:
      # Copies, not symlinks: DT Prototype resolves the interpreter path before running it.
      - uv run --no-project --python 3.12 python -m venv --copies --without-pip .venv-opendsm
      - uv pip install --python .venv-opendsm/bin/python -r prototype/requirements-opendsm-verified.txt
      - echo "Set DT_OPENDSM_PYTHON=$PWD/.venv-opendsm/bin/python to use it"

  compose:up:
    desc: Build and start the Compose stack at http://127.0.0.1:8000
    cmds:
      - docker compose up --build -d --wait

  compose:down:
    desc: Stop and remove the Compose stack (keeps the runs volume)
    cmds:
      - docker compose down
