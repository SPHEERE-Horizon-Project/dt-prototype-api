[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "spheere-dt-prototype-api"
version = "0.1.0"
description = "Local HTTP API for the DT Prototype"
requires-python = ">=3.12,<3.13"
dependencies = [
  "dt-prototype",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.9,<1",
  "PyYAML>=6,<7",
  "jsonschema>=4.23,<5",
  "numpy==2.3.5",
  "pandas==3.0.1",
  "matplotlib==3.11.2",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest==9.1.1",
  "openapi-spec-validator>=0.7,<1",
  "ruff>=0.13,<1",
]

[tool.uv.sources]
dt-prototype = { path = "prototype" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
